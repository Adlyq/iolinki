name: iolinki CI

on:
  push:
    branches: [ own_dev, develop ]
  pull_request:
    branches: [ own_dev, develop ]

jobs:
  stm32g0-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get pinned ST device headers and startup
        uses: actions/checkout@v4
        with:
          repository: STMicroelectronics/cmsis-device-g0
          ref: f576c24e123edf3332988ecd49512c0f35f85186
          path: vendor/cmsis-device-g0
      - name: Get pinned CMSIS core
        uses: actions/checkout@v4
        with:
          repository: ARM-software/CMSIS_5
          ref: 61e36449f53c25ef7825c40f7dd93685736f457f
          path: vendor/CMSIS_5
      - name: Install Arm GCC
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Test receive queue
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iexamples/stm32g0_tiol112 examples/stm32g0_tiol112/rx_queue.c examples/stm32g0_tiol112/tests/test_rx_queue.c -o /tmp/rx-queue-test
          /tmp/rx-queue-test
      - name: Build complete STM32G0 firmware
        env:
          STM32_CMSIS_ROOT: ${{ github.workspace }}/vendor/cmsis-device-g0
          CMSIS_CORE_ROOT: ${{ github.workspace }}/vendor/CMSIS_5/CMSIS/Core
        run: bash examples/stm32g0_tiol112/build.sh
      - name: Archive firmware and memory map
        uses: actions/upload-artifact@v4
        with:
          name: stm32g0-tiol112-gcc
          path: |
            examples/stm32g0_tiol112/build/reference-device.elf
            examples/stm32g0_tiol112/build/reference-device.hex
            examples/stm32g0_tiol112/build/reference-device.map

  # Required gate: code quality, unit tests, and virtual-master conformance.
  # Lightweight, so it is fast and reliable.
  docker-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix Permissions and Cleanup
        run: |
          sudo chmod -R 777 .
          sudo rm -rf build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Host Tests in Docker
        run: |
          chmod +x run_all_tests_docker.sh
          ./run_all_tests_docker.sh host

  sbom-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test SBOM generator and evidence bundle
        run: |
          python3 tools/test_generate_sbom.py
          python3 tools/test_evidence_bundle.py
          python3 tools/test_bench_record.py
          python3 tools/test_bench_run.py

  # Release optimisations expose warnings that Debug (-O0) never emits
  # (e.g. -Wmaybe-uninitialized). Build and test at -O3 with -Werror.
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcmocka-dev
      - name: Configure Release with strict warnings
        run: |
          cmake -B build/release -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror -Wpedantic -Wconversion -Wshadow"
      - name: Build
        run: cmake --build build/release --parallel "$(nproc)"
      - name: Test
        run: ctest --test-dir build/release --output-on-failure

  # Static analysis that needs a compiler: the gcc-only diagnostics, the unit
  # suite under the sanitizers, the clang static analyzer and the ISR/main
  # field ownership gate.
  #
  # `context` is report-only while the context split is in progress: it exits 0
  # and prints the findings. The change that removes the last finding switches
  # the checker to `--enforce` in tools/gates.sh; this job then fails on any
  # new violation without a workflow edit.
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang libcmocka-dev
      - name: gcc diagnostics, sanitizers, analyzer, field ownership
        run: ./tools/gates.sh gcc sanitize analyzer context

  # Documentation cannot drift from the code: the generated blocks (error
  # codes, stats fields, public API, field ownership) are compared verbatim
  # against their sources and Doxygen must stay warning-free.
  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
      - name: Generated documentation blocks and Doxygen
        run: ./tools/gates.sh docs

  # Lint the maintained CI/test scripts. Keep this list in sync with the
  # shellcheck step in tools/gates.sh.
  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          shellcheck -S warning tools/build_matrix.sh tools/coverage.sh \
            tools/diff_matrix.sh tools/check_ownership.sh \
            tools/check_test_whitebox.sh tools/check_test_gates.sh \
            tools/check_nullability.sh tools/fuzz.sh \
            tools/clean_builds.sh tools/test_install_consumer.sh \
            tools/wcet_run.sh \
            tools/check_profile_abi.sh tools/matrix_configs.sh \
            test_all.sh tools/gates.sh .docker_test_entrypoint.sh

  # Coverage floor: line coverage of src/ must not drop below the checked-in
  # baseline in tools/coverage_baseline.txt.
  coverage-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcmocka-dev gcovr
      - name: Coverage floor
        run: ./tools/coverage.sh --check

  # Host-side path-length proxy for the ISR/main pumps (call counts, not CPU
  # cycles; the target-side DWT gate is documented in tools/wcet/README.md).
  wcet-path-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
      - name: Path-length gate
        run: ./tools/wcet_run.sh --check

  # libFuzzer over the three parsers that take untrusted bytes: received
  # octets, ISDU payloads and OD indices/values. A compiler without the
  # libFuzzer runtime skips the group (exit 0) instead of failing the job.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang
      - name: Fuzz the parsers (60 s per target)
        run: ./tools/gates.sh fuzz
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: build/fuzz/artifacts/
          if-no-files-found: ignore

  # Delivery gate for compile-time configurations: every feature toggle, ISR
  # granularity and platform must at least build; the default and release
  # configurations also run the unit suite.
  build-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcmocka-dev
      - name: Compile matrix
        run: ./tools/build_matrix.sh
      - name: Differential frame gate
        run: ./tools/diff_matrix.sh
      - name: File size gate
        run: python3 tools/check_file_size.py --selftest && python3 tools/check_file_size.py
      - name: DLL ownership isolation
        run: ./tools/check_ownership.sh
      - name: Test white-box boundary
        run: ./tools/check_test_whitebox.sh --selftest && ./tools/check_test_whitebox.sh
      - name: Test gate conventions
        run: ./tools/check_test_gates.sh
      - name: Install and consume
        run: ./tools/test_install_consumer.sh

  # ROM/RAM measurement of the structural configurations:
  # source integration vs non-LTO static library, with and without
  # --gc-sections. Same toolchain as the STM32G0 example.
  #
  # This job installs the GNU toolchain from apt, so it gates the gcc baseline
  # (`tools/size_baseline.csv`). The shipping numbers are the ATFE ones
  # (`tools/size_baseline.atfe.csv`); the Docker image carries the pinned ATfE
  # tarball and the docker-validation job runs that gate.
  size-baseline:
    runs-on: ubuntu-latest
    env:
      IOLINKI_SIZE_TOOLCHAIN: gcc
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi python3
      - name: Size gate (no growth beyond the baseline, plus selftest)
        run: ./tools/size_matrix.py --check --selftest --table

  # Branch protection on develop requires the REAL jobs directly:
  # docker-validation, sbom-tools. Do not reintroduce echo-only proxy jobs —
  # they let a red job hide behind a green run.
